<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>CORS 테스트</title>
  </head>
  <body>
    <h1>CORS 테스트</h1>

    <button onclick="testCors()">API 호출하기</button>

    <p id="result"></p>

    <script>
      async function testCors() {
        try {
          const nickname = "수현";

          const response = await fetch(
            `http://localhost:8080/members/nickname/${encodeURIComponent(nickname)}`,
          );

          const data = await response.json();

          console.log("API 응답:", data);

          document.getElementById("result").innerText = data.available
            ? "사용 가능한 닉네임입니다."
            : "이미 사용 중인 닉네임입니다.";
        } catch (error) {
          console.error("API 호출 실패:", error);
        }
      }
    </script>
  </body>
</html>
