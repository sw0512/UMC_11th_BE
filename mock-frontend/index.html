<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>CORS 테스트</title>
  </head>
  <body>
    <h1>CORS 테스트</h1>

    <button onclick="testCors()">API 호출하기</button>

    <script>
      async function testCors() {
        try {
          const response = await fetch(
            "http://localhost:8080/members/nickname/noco",
          );

          const data = await response.json();
          console.log(data);
        } catch (error) {
          console.error("API 호출 실패:", error);
        }
      }
    </script>
  </body>
</html>
